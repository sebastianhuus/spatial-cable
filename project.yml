name: spatial-cable
options:
  bundleIdPrefix: com.sebastianhuus
  deploymentTarget:
    macOS: "14.4"
targets:
  spatial-cable:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: spatial-cable
        excludes:
          - Info.plist
          - spatial-cable.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastianhuus.spatial-cable
        INFOPLIST_FILE: spatial-cable/Info.plist
        CODE_SIGN_ENTITLEMENTS: spatial-cable/spatial-cable.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
